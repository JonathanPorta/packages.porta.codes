name: 'Load the repository-signing secret'
description: 'Load ONLY the repository-signing authority domain secret from Bitwarden Secrets Manager.'

# One loader per authority domain (secrets.bwsm-authority-domains@1), so a job
# in one domain has no mapping by which it could load another domain's secret.
# The UUID below is a PLACEHOLDER until `scripts/bws/bootstrap.sh
# --secrets-list .bws/repository-signing.list --loader .github/actions/load-repository-signing/action.yml`
# fills it (see README "Provisioning"); workflows refuse to run while it is.
# The `secrets:` block is parsed line by line as `<UUID> > <ENV_VAR>` — no
# comments inside it.

inputs:
  access_token:
    description: 'The repository-signing machine account token (the Environment secret BWS_ACCESS_TOKEN).'
    required: true

runs:
  using: 'composite'
  steps:
    - name: '🔐 Load PACKAGES_REPO_SIGNING_KEY'
      shell: bash
      env:
        INPUT_ACCESS_TOKEN: ${{ inputs.access_token }}
        INPUT_SECRETS: |
          00000000-0000-0000-0000-000000000002 > PACKAGES_REPO_SIGNING_KEY
      run: bash "$GITHUB_WORKSPACE/scripts/bws/sm-action-run.sh"
